spring.application.name=jumpbeyondfriends

# Database Setup
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jumpbeyondfriends}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}

spring.flyway.url=${DB_MIGRATION_URL:${spring.datasource.url}}
spring.flyway.user=${DB_MIGRATION_USERNAME:${spring.datasource.username}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${spring.datasource.password}}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Google OAuth setup
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.session.timeout=14d
spring.session.jdbc.initialize-schema=never

# Spring ENV Variables
app.enroll.code-hash=${ENROLL_CODE_HASH}