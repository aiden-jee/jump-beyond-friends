spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/jumpbeyondfriends_test}
spring.datasource.username=${TEST_DB_USERNAME:${user.name}}
spring.datasource.password=${TEST_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Test-only credentials. OIDC login is simulated; tests never contact Google.
spring.security.oauth2.client.registration.google.client-id=test-google-client
spring.security.oauth2.client.registration.google.client-secret=test-google-secret

